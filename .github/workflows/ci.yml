name: Proton Pages CI Quality Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-verification:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Type Check & Build
        run: npm run build

      - name: Run Frontend Tests
        run: npm test --if-present

  backend-verification:
    name: Scientific Chemistry Engine Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pytest pytest-cov

      - name: Run Pytest Chemistry Verification Suite
        run: |
          python -m pytest services/chemistry/tests --cov=services.chemistry.app --cov-report=term-missing --cov-fail-under=80

  codebase-metrics:
    name: Codebase LOC Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Verified LOC Accounting
        run: python scripts/count_loc.py
