version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proton_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proton_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-proton_pages}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proton} -d ${POSTGRES_DB:-proton_pages}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: proton_backend
    restart: unless-stopped
    command: >
      sh -c "python -m alembic -c services/chemistry/alembic.ini upgrade head &&
             uvicorn services.chemistry.app.server:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-proton}:${POSTGRES_PASSWORD:-proton_dev_secret}@postgres:5432/${POSTGRES_DB:-proton_pages}
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./services/chemistry:/app/services/chemistry
      - ./scripts:/app/scripts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: proton_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
      VITE_USE_MOCKS: "false"
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
