[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "proton-pages-chemistry"
version = "1.0.0"
description = "Deterministic Chemistry Engine Scientific Library for Proton Pages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
